name: Build UID Filter Module

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: 27.3.13750724
  NDK_DIRNAME: android-ndk-r27d
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: Build module (arm64 / Android 13+)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download and install Android NDK ${{ env.NDK_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ndkZip  = Join-Path $env:RUNNER_TEMP 'ndk.zip'
          $ndkRoot = Join-Path $env:RUNNER_TEMP $env:NDK_DIRNAME
          $url     = "https://dl.google.com/android/repository/$env:NDK_DIRNAME-windows.zip"

          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $ndkZip
          Expand-Archive -Path $ndkZip -DestinationPath $env:RUNNER_TEMP -Force

          # 组装成 Android SDK 标准目录结构：<SDK>/ndk/<version>
          $sdkRoot  = Join-Path $env:RUNNER_TEMP 'android-sdk'
          $ndkHome  = Join-Path $sdkRoot "ndk\$env:NDK_VERSION"
          New-Item -ItemType Directory -Force -Path (Split-Path $ndkHome) | Out-Null
          Move-Item -Path $ndkRoot -Destination $ndkHome

          # 校验版本号，避免下载错了 r27x 变体
          $sourceProps = Join-Path $ndkHome 'source.properties'
          Get-Content $sourceProps
          if (-not (Select-String -Path $sourceProps -Pattern "Pkg\.Revision\s*=\s*$([regex]::Escape($env:NDK_VERSION))" -Quiet)) {
            Write-Error "NDK 版本不匹配，期望 $env:NDK_VERSION"
          }

          "ANDROID_SDK_ROOT=$sdkRoot"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_HOME=$sdkRoot"      | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_NDK_HOME=$ndkHome"  | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify NDK toolchain
        shell: pwsh
        run: |
          $clang = Join-Path $env:ANDROID_NDK_HOME 'toolchains\llvm\prebuilt\windows-x86_64\bin\clang++.cmd'
          if (-not (Test-Path $clang)) {
            Write-Error "找不到 clang++：$clang"
            exit 1
          }
          & $clang --version

      - name: Build module
        shell: pwsh
        run: python tools/uid-seccomp-module/build.py --module-only

      - name: Collect artifacts
        id: collect
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path build -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $zip) {
            Write-Error '未找到构建产物 .zip'
            exit 1
          }
          "zip=$($zip.FullName)"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($zip.BaseName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "构建产物：$($zip.FullName)"
          Get-Content "$($zip.FullName).sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.version }}
          path: |
            build/**/*.zip
            build/**/*.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/**/*.zip
            build/**/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
