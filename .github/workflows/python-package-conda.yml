name: Build UID Filter Module

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# softprops/action-gh-release 需要写权限
permissions:
  contents: write

env:
  NDK_VERSION: 27.3.13750724
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: Build module (arm64 / Android 13+)
    # 如果 build.py 依赖 Windows 特有的路径处理，把下面改成 windows-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMGR" ]; then
            echo "sdkmanager not found at $SDKMGR" >&2
            exit 1
          fi

          # 接受许可（GitHub runner 上通常已接受，失败也不影响）
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "ndk;${NDK_VERSION}"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify NDK toolchain
        run: |
          set -euo pipefail
          ls -d "$ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version

      - name: Build module
        run: python tools/uid-seccomp-module/build.py --module-only

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          ZIP="$(find build -type f -name '*.zip' | sort | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "::error::未找到构建产物 .zip" >&2
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$ZIP" .zip)" >> "$GITHUB_OUTPUT"
          echo "构建产物：$ZIP"

      - name: Show SHA-256
        run: cat "${{ steps.collect.outputs.zip }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.version }}
          path: |
            build/**/*.zip
            build/**/*.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/**/*.zip
            build/**/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
